<script id="fragmentShader" type="fragment">
    #extension GL_OES_standard_derivatives : enable
    
    precision mediump float;

    varying vec4 fragcolor;
    varying vec3 fragPosition;
    varying vec3 fragNormal;
    varying vec3 vLightColor1;
    varying vec3 vLightLoc1;
    varying vec3 vLightColor2;
    varying vec3 vLightLoc2;
    varying float vKa;
    uniform int fsShadingType;
    uniform float clipPlaneX; // 添加X軸裁剪平面位置

    void main(void) {
        // 判斷是否被裁剪掉
        if(fragPosition.x > clipPlaneX) {
            discard; // 丟棄片段，不進行渲染
        }

        if(fsShadingType == 0) { // Flat shading
            // 計算面法向量 (使用 derivatives 計算相鄰片段的差異來獲得面法向量)
            vec3 dx = dFdx(fragPosition);
            vec3 dy = dFdy(fragPosition);
            vec3 N = normalize(cross(dx, dy));

            // 第一個光源
            vec3 L1 = normalize(vLightLoc1 - fragPosition);
            vec3 V = -normalize(fragPosition);
            vec3 H1 = normalize(L1 + V);

            // 第二個光源
            vec3 L2 = normalize(vLightLoc2 - fragPosition);
            vec3 H2 = normalize(L2 + V);

            float kd = 0.6;
            float ks = 0.3;

            // 第一個光源的貢獻
            vec3 ambient1 = vKa * vLightColor1;
            vec3 diffuse1 = kd * max(dot(N, L1), 0.0) * vLightColor1;
            vec3 specular1 = ks * pow(max(dot(N, H1), 0.0), 32.0) * vLightColor1;

            // 第二個光源的貢獻
            vec3 ambient2 = vKa * vLightColor2;
            vec3 diffuse2 = kd * max(dot(N, L2), 0.0) * vLightColor2;
            vec3 specular2 = ks * pow(max(dot(N, H2), 0.0), 32.0) * vLightColor2;

            // 組合兩個光源的效果
            vec3 lightEffect = ambient1 + diffuse1 + specular1 + ambient2 + diffuse2 + specular2;
            gl_FragColor = vec4(fragcolor.rgb * lightEffect, 1.0);
        }
        else if(fsShadingType == 1) { // Gouraud shading
            // 直接使用頂點著色器計算的顏色
            gl_FragColor = fragcolor;
        }
        else { // Phong shading
            vec3 N = normalize(fragNormal);
            
            // 第一個光源
            vec3 L1 = normalize(vLightLoc1 - fragPosition);
            vec3 V = -normalize(fragPosition);
            vec3 H1 = normalize(L1 + V);

            // 第二個光源
            vec3 L2 = normalize(vLightLoc2 - fragPosition);
            vec3 H2 = normalize(L2 + V);

            float kd = 0.6;
            float ks = 0.3;

            // 第一個光源的貢獻
            vec3 ambient1 = vKa * vLightColor1;
            vec3 diffuse1 = kd * max(dot(N, L1), 0.0) * vLightColor1;
            vec3 specular1 = ks * pow(max(dot(N, H1), 0.0), 32.0) * vLightColor1;

            // 第二個光源的貢獻
            vec3 ambient2 = vKa * vLightColor2;
            vec3 diffuse2 = kd * max(dot(N, L2), 0.0) * vLightColor2;
            vec3 specular2 = ks * pow(max(dot(N, H2), 0.0), 32.0) * vLightColor2;

            // 組合兩個光源的效果
            vec3 lightEffect = ambient1 + diffuse1 + specular1 + ambient2 + diffuse2 + specular2;
            gl_FragColor = vec4(fragcolor.rgb * lightEffect, 1.0);
        }
    }
</script>

<script id="vertexShader" type="vertex">
    attribute vec3 aVertexPosition;
    attribute vec3 aFrontColor;
    attribute vec3 aVertexNormal;

    uniform mat4 uMVMatrix;
    uniform mat4 uPMatrix;
    uniform float Ka;
    uniform vec3 lightLoc1;
    uniform vec3 lightLoc2;
    uniform vec3 lightColor1;
    uniform vec3 lightColor2;
    uniform int vsShadingType;

    varying vec4 fragcolor;
    varying vec3 fragPosition;
    varying vec3 fragNormal;
    varying vec3 vLightColor1;
    varying vec3 vLightLoc1;
    varying vec3 vLightColor2;
    varying vec3 vLightLoc2;
    varying float vKa;

    void main(void) {
        vec3 mvVertex = (uMVMatrix * vec4(aVertexPosition, 1.0)).xyz;
        mat3 normalMVMatrix = mat3(uMVMatrix);
        vec3 mvNormal = normalMVMatrix * aVertexNormal;

        // 對所有著色模式都傳遞必要的數據
        vLightColor1 = lightColor1;
        vLightLoc1 = lightLoc1;
        vLightColor2 = lightColor2;
        vLightLoc2 = lightLoc2;
        vKa = Ka;
        fragPosition = mvVertex;
        fragNormal = mvNormal;

        if(vsShadingType == 0) { // Flat shading
            // 對於平面著色，我們只需傳遞基本顏色
            // 光照計算將在片段著色器中使用面法向量進行
            fragcolor = vec4(aFrontColor, 1.0);
        }
        else if(vsShadingType == 1) { // Gouraud shading
            // 在頂點著色器中計算光照
            vec3 N = normalize(mvNormal);
            
            // 第一個光源
            vec3 L1 = normalize(lightLoc1 - mvVertex);
            vec3 V = -normalize(mvVertex);
            vec3 H1 = normalize(L1 + V);

            // 第二個光源
            vec3 L2 = normalize(lightLoc2 - mvVertex);
            vec3 H2 = normalize(L2 + V);

            float kd = 0.6;
            float ks = 0.3;

            // 第一個光源的貢獻
            vec3 ambient1 = Ka * lightColor1;
            vec3 diffuse1 = kd * max(dot(N, L1), 0.0) * lightColor1;
            vec3 specular1 = ks * pow(max(dot(N, H1), 0.0), 32.0) * lightColor1;

            // 第二個光源的貢獻
            vec3 ambient2 = Ka * lightColor2;
            vec3 diffuse2 = kd * max(dot(N, L2), 0.0) * lightColor2;
            vec3 specular2 = ks * pow(max(dot(N, H2), 0.0), 32.0) * lightColor2;
            
            // 將計算結果作為顏色傳遞
            vec3 lightEffect = ambient1 + diffuse1 + specular1 + ambient2 + diffuse2 + specular2;
            fragcolor = vec4(aFrontColor * lightEffect, 1.0);
        }
        else { // Phong shading
            // 傳遞基本顏色，光照計算將在片段著色器中進行
            fragcolor = vec4(aFrontColor, 1.0);
        }
        
        gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);
    }
</script>

<script type="text/javascript">
    // common variables
    var gl;
    var shaderProgram;

    var mvMatrix = mat4.create();
    var pMatrix  = mat4.create();

    // Teapot model vertex buffers
    var teapotVertexPositionBuffer;
    var teapotVertexNormalBuffer;
    var teapotVertexFrontColorBuffer;

    // Kangaroo model vertex buffers
    var kangarooVertexPositionBuffer;
    var kangarooVertexNormalBuffer;
    var kangarooVertexFrontColorBuffer;

    // Base scale values for each model
    var teapotBaseScale = [0.7, 0.7, 0.7];
    var kangarooBaseScale = [20.0, 20.0, 20.0];

    var teapotAngle = 180;
    var lastTime    = 0;
    var shadingType = 1; // Default: Gouraud shading

    var ka = 0.1;
    var light_locations1 = new Float32Array([30., 20., -25.]); // First light position
    var light_colors1 = new Float32Array([1.0, 0.8, 0.8]); // First light color (reddish)
    var light_locations2 = new Float32Array([-20., 15., -40.]); // Second light position
    var light_colors2 = new Float32Array([0.8, 0.8, 1.0]); // Second light color (bluish)
    
    // Clipping plane settings
    var clipPlaneX = 0.0; // X-axis clipping plane for teapot
    var clipPlaneZ = 0.0; // Z-axis clipping plane for kangaroo

    // Debug related variables
    var debugMode = false;
    var frameCounter = 0;

    //*************************************************
    // Initialization functions
    //*************************************************
    function initGL(canvas) {
        try {
            gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
            gl.viewportWidth  = canvas.width;
            gl.viewportHeight = canvas.height;
        } 
        catch (e) {
        }

        if (!gl) {
            alert("Could not initialise WebGL");
            return;
        }

        // 檢查並啟用 OES_standard_derivatives 擴展
        var ext = gl.getExtension('OES_standard_derivatives');
        if (!ext) {
            alert("OES_standard_derivatives extension is not supported.");
            return;
        }
    }

    function getShader(gl, id) {
        var shaderScript = document.getElementById(id);
        if (!shaderScript) {
            return null;
        }

        var shaderSource = "";
        var k = shaderScript.firstChild;
        while (k) {
            if (k.nodeType == 3) {
                shaderSource += k.textContent;
            }

            k = k.nextSibling;
        }

        var shader;
        if (shaderScript.type == "fragment") {
            shader = gl.createShader(gl.FRAGMENT_SHADER);
        } 
        else if (shaderScript.type == "vertex") {
            shader = gl.createShader(gl.VERTEX_SHADER);
        } 
        else {
            return null;
        }

        gl.shaderSource(shader, shaderSource);
        gl.compileShader(shader);

        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            alert(gl.getShaderInfoLog(shader));
            return null;
        }

        return shader;
    }

    function initShaders() {
        var fragmentShader = getShader(gl, "fragmentShader");
        var vertexShader   = getShader(gl, "vertexShader");

        if (!fragmentShader || !vertexShader) {
            return;
        }

        shaderProgram = gl.createProgram();
        gl.attachShader(shaderProgram, vertexShader);
        gl.attachShader(shaderProgram, fragmentShader);
        gl.linkProgram(shaderProgram);

        if (!gl.getProgramParameter(shaderProgram, gl.LINK_STATUS)) {
            var infoLog = gl.getProgramInfoLog(shaderProgram);
            console.error("Shader program link error:", infoLog);
            alert("Could not initialise shaders. Error: " + gl.getProgramInfoLog(shaderProgram));
            return;
        }
        console.log("Shader program initialized successfully");

        gl.useProgram(shaderProgram);

        shaderProgram.vertexPositionAttribute = gl.getAttribLocation(shaderProgram, "aVertexPosition");
        gl.enableVertexAttribArray(shaderProgram.vertexPositionAttribute);
        shaderProgram.vertexFrontColorAttribute = gl.getAttribLocation(shaderProgram, "aFrontColor");
        gl.enableVertexAttribArray(shaderProgram.vertexFrontColorAttribute);
        shaderProgram.vertexNormalAttribute = gl.getAttribLocation(shaderProgram, "aVertexNormal");
        gl.enableVertexAttribArray(shaderProgram.vertexNormalAttribute);

        gl.uniform1f(gl.getUniformLocation(shaderProgram, "Ka"), ka);
        gl.uniform3fv(gl.getUniformLocation(shaderProgram, "lightLoc1"), light_locations1);
        gl.uniform3fv(gl.getUniformLocation(shaderProgram, "lightLoc2"), light_locations2);
        gl.uniform3fv(gl.getUniformLocation(shaderProgram, "lightColor1"), light_colors1);
        gl.uniform3fv(gl.getUniformLocation(shaderProgram, "lightColor2"), light_colors2);
        gl.uniform1i(gl.getUniformLocation(shaderProgram, "vsShadingType"), shadingType);
        gl.uniform1i(gl.getUniformLocation(shaderProgram, "fsShadingType"), shadingType);
        
        // Set clipping planes and object ID
        gl.uniform1f(gl.getUniformLocation(shaderProgram, "clipPlaneX"), clipPlaneX);
        gl.uniform1f(gl.getUniformLocation(shaderProgram, "clipPlaneZ"), clipPlaneZ);
        gl.uniform1i(gl.getUniformLocation(shaderProgram, "objectID"), 0); // Initial ID

        // Check if all uniform variables are successfully acquired
        if (debugMode) {
            console.log("Shader variable location check:");
            console.log(" - pMatrixUniform:", gl.getUniformLocation(shaderProgram, "uPMatrix"));
            console.log(" - mvMatrixUniform:", gl.getUniformLocation(shaderProgram, "uMVMatrix"));
            console.log(" - objectID uniformLocation:", gl.getUniformLocation(shaderProgram, "objectID"));
            console.log(" - clipPlaneX uniformLocation:", gl.getUniformLocation(shaderProgram, "clipPlaneX"));
            console.log(" - clipPlaneZ uniformLocation:", gl.getUniformLocation(shaderProgram, "clipPlaneZ"));
        }

        shaderProgram.pMatrixUniform  = gl.getUniformLocation(shaderProgram, "uPMatrix");
        shaderProgram.mvMatrixUniform = gl.getUniformLocation(shaderProgram, "uMVMatrix");
    }

    function setMatrixUniforms() {
        gl.uniformMatrix4fv(shaderProgram.pMatrixUniform, false, pMatrix);
        gl.uniformMatrix4fv(shaderProgram.mvMatrixUniform, false, mvMatrix);
    }

    function degToRad(degrees) {
        return degrees * Math.PI / 180;
    }

    function handleLoadedTeapot(teapotData) {
        console.log("Teapot model loaded successfully, processing data...");
        teapotVertexPositionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, teapotVertexPositionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(teapotData.vertexPositions), gl.STATIC_DRAW);
        teapotVertexPositionBuffer.itemSize = 3;
        teapotVertexPositionBuffer.numItems = teapotData.vertexPositions.length / 3;

        teapotVertexNormalBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, teapotVertexNormalBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(teapotData.vertexNormals), gl.STATIC_DRAW);
        teapotVertexNormalBuffer.itemSize = 3;
        teapotVertexNormalBuffer.numItems = teapotData.vertexNormals.length / 3;

        teapotVertexFrontColorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, teapotVertexFrontColorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(teapotData.vertexFrontcolors), gl.STATIC_DRAW);
        teapotVertexFrontColorBuffer.itemSize = 3;
        teapotVertexFrontColorBuffer.numItems = teapotData.vertexFrontcolors.length / 3;
        
        console.log("Teapot model processing completed. Vertex count:", teapotVertexPositionBuffer.numItems);
    }

    function loadTeapot() {
        console.log("Starting to load teapot model...");
        var request = new XMLHttpRequest();
        request.open("GET", "./model/Teapot.json");
        request.onreadystatechange = function () {
            if (request.readyState == 4) {
                if (request.status == 200) {
                    handleLoadedTeapot(JSON.parse(request.responseText));
                } else {
                    console.error("Failed to load teapot model, status code:", request.status);
                }
            }
        }
        request.send();
    }

    // Kangaroo model loading
    function handleLoadedKangaroo(kangarooData) {
        console.log("Kangaroo model loaded successfully, processing data...");
        kangarooVertexPositionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, kangarooVertexPositionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(kangarooData.vertexPositions), gl.STATIC_DRAW);
        kangarooVertexPositionBuffer.itemSize = 3;
        kangarooVertexPositionBuffer.numItems = kangarooData.vertexPositions.length / 3;

        kangarooVertexNormalBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, kangarooVertexNormalBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(kangarooData.vertexNormals), gl.STATIC_DRAW);
        kangarooVertexNormalBuffer.itemSize = 3;
        kangarooVertexNormalBuffer.numItems = kangarooData.vertexNormals.length / 3;

        kangarooVertexFrontColorBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, kangarooVertexFrontColorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(kangarooData.vertexFrontcolors), gl.STATIC_DRAW);
        kangarooVertexFrontColorBuffer.itemSize = 3;
        kangarooVertexFrontColorBuffer.numItems = kangarooData.vertexFrontcolors.length / 3;
        
        console.log("Kangaroo model processing completed. Vertex count:", kangarooVertexPositionBuffer.numItems);
    }

    function loadKangaroo() {
        console.log("Starting to load kangaroo model...");
        var request = new XMLHttpRequest();
        request.open("GET", "./model/Kangaroo.json");
        request.onreadystatechange = function () {
            if (request.readyState == 4) {
                if (request.status == 200) {
                    handleLoadedKangaroo(JSON.parse(request.responseText));
                } else {
                    console.error("Failed to load kangaroo model, status code:", request.status);
                }
            }
        }
        request.send();
    }

    //*************************************************
    // Rendering functions
    //*************************************************
    function drawScene() {
        gl.viewport(0, 0, gl.viewportWidth, gl.viewportHeight);
        gl.clearColor(ka, ka, ka, 1.0);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        // Check if models are loaded
        if (teapotVertexPositionBuffer == null || 
            teapotVertexNormalBuffer == null || 
            teapotVertexFrontColorBuffer == null ||
            kangarooVertexPositionBuffer == null ||
            kangarooVertexNormalBuffer == null ||
            kangarooVertexFrontColorBuffer == null) {
            
            return;
        }
        
        // Output debug info every 60 frames (when debug mode is on)
        if (debugMode && frameCounter % 60 === 0) {
            console.log("---- Rendering Status ----");
            console.log("Current shading mode:", shadingType);
            console.log("Light 1 position:", light_locations1);
            console.log("Light 2 position:", light_locations2);
            console.log("X-axis clipping plane:", clipPlaneX);
            console.log("Z-axis clipping plane:", clipPlaneZ);
        }
        frameCounter++;
        
        // Set projection matrix
        mat4.perspective(45, gl.viewportWidth / gl.viewportHeight, 0.1, 100.0, pMatrix);
        
        // Set common lighting parameters
        gl.uniform1f(gl.getUniformLocation(shaderProgram, "Ka"), ka);
        gl.uniform3fv(gl.getUniformLocation(shaderProgram, "lightLoc1"), light_locations1);
        gl.uniform3fv(gl.getUniformLocation(shaderProgram, "lightLoc2"), light_locations2);
        gl.uniform3fv(gl.getUniformLocation(shaderProgram, "lightColor1"), light_colors1);
        gl.uniform3fv(gl.getUniformLocation(shaderProgram, "lightColor2"), light_colors2);
        gl.uniform1i(gl.getUniformLocation(shaderProgram, "vsShadingType"), shadingType);
        gl.uniform1i(gl.getUniformLocation(shaderProgram, "fsShadingType"), shadingType);

        // Draw teapot - on the left side
        drawTeapot(-15, 0, -50);
        
        // Draw kangaroo - on the right side
        drawKangaroo(15, 0, -50);
    }
    
    // Function to draw teapot
    function drawTeapot(posX, posY, posZ) {
        // Output teapot transformation parameters in debug mode
        if (debugMode && frameCounter % 60 === 0) {
            console.log("---- Teapot Rendering Info ----");
            console.log("Position: [" + posX + ", " + posY + ", " + posZ + "]");
            var rotateVec = update_rotate();
            var scaleVec = update_scale();
            var shearVals = update_shear();
            console.log("Rotation: [" + rotateVec[0] + ", " + rotateVec[1] + ", " + rotateVec[2] + "]");
            console.log("Scale: [" + scaleVec[0] + ", " + scaleVec[1] + ", " + scaleVec[2] + "]");
            console.log("Shear: [" + shearVals[0] + ", " + shearVals[1] + ", " + shearVals[2] + "]");
        }
        
        // Reset model-view matrix
        mat4.identity(mvMatrix);
        
        // Get user-defined transformation parameters
        var trans = update_trans();
        var rotate = update_rotate();
        var scale = update_scale();
        var shear = update_shear();
        
        // Set teapot position
        mat4.translate(mvMatrix, [posX, posY, posZ]);
        
        // Apply slider-controlled translation
        mat4.translate(mvMatrix, [trans[0], trans[1], trans[2]]);
        
        // Apply rotation - using user-defined rotation values
        mat4.rotate(mvMatrix, degToRad(rotate[0]), [1, 0, 0]);
        mat4.rotate(mvMatrix, degToRad(rotate[1] + teapotAngle), [0, 1, 0]);
        mat4.rotate(mvMatrix, degToRad(rotate[2]), [0, 0, 1]);
        
        // Apply scaling - multiply base scale values with user-defined scale values
        mat4.scale(mvMatrix, [
            teapotBaseScale[0] * scale[0], 
            teapotBaseScale[1] * scale[1], 
            teapotBaseScale[2] * scale[2]
        ]);
        
        // Apply shear - using user-defined shear values
        applyShear(mvMatrix, shear[0], shear[1], shear[2]);
        
        // Set transformation parameters
        setMatrixUniforms();
        
        // Set teapot's clipping plane and object ID
        gl.uniform1f(gl.getUniformLocation(shaderProgram, "clipPlaneX"), clipPlaneX);
        gl.uniform1i(gl.getUniformLocation(shaderProgram, "objectID"), 0);
        
        // Bind teapot's vertex data
        gl.bindBuffer(gl.ARRAY_BUFFER, teapotVertexPositionBuffer);
        gl.vertexAttribPointer(shaderProgram.vertexPositionAttribute, 
                            teapotVertexPositionBuffer.itemSize, 
                            gl.FLOAT, 
                            false, 
                            0, 
                            0);

        // Bind teapot's color data
        gl.bindBuffer(gl.ARRAY_BUFFER, teapotVertexFrontColorBuffer);
        gl.vertexAttribPointer(shaderProgram.vertexFrontColorAttribute, 
                            teapotVertexFrontColorBuffer.itemSize, 
                            gl.FLOAT, 
                            false, 
                            0, 
                            0);
        
        // Bind teapot's normal data
        gl.bindBuffer(gl.ARRAY_BUFFER, teapotVertexNormalBuffer);
        gl.vertexAttribPointer(shaderProgram.vertexNormalAttribute, 
                            teapotVertexNormalBuffer.itemSize, 
                            gl.FLOAT, 
                            false, 
                            0, 
                            0);
        
        // Draw teapot
        gl.drawArrays(gl.TRIANGLES, 0, teapotVertexPositionBuffer.numItems);
    }

                            0);

        // Bind kangaroo's color data
        gl.bindBuffer(gl.ARRAY_BUFFER, kangarooVertexFrontColorBuffer);
        gl.vertexAttribPointer(shaderProgram.vertexFrontColorAttribute, 
                            kangarooVertexFrontColorBuffer.itemSize, 
                            gl.FLOAT, 
                            false, 
                            0, 
                            0);
        
        // Bind kangaroo's normal data
        gl.bindBuffer(gl.ARRAY_BUFFER, kangarooVertexNormalBuffer);
        gl.vertexAttribPointer(shaderProgram.vertexNormalAttribute, 
                            kangarooVertexNormalBuffer.itemSize, 
                            gl.FLOAT, 
                            false, 
                            0, 
                            0);
        
        // Draw kangaroo
        gl.drawArrays(gl.TRIANGLES, 0, kangarooVertexPositionBuffer.numItems);
    }

    function animate() {
        var timeNow = new Date().getTime();
        if (lastTime != 0) {
            var elapsed = timeNow - lastTime;
            teapotAngle += 0.03 * elapsed;
        }
        
        lastTime = timeNow;
    }

    function tick() {
        requestAnimFrame(tick);
        drawScene();
        animate();
    }

    function webGLStart() {
        var canvas = document.getElementById("ICG-canvas");
        initGL(canvas);
        initShaders();
        loadTeapot();
        loadKangaroo(); // Load kangaroo model

        gl.clearColor(ka, ka, ka, 1.0);
        gl.enable(gl.DEPTH_TEST);

        // Add WebGL context loss handling
        canvas.addEventListener("webglcontextlost", function(event) {
            event.preventDefault();
            console.error("WebGL context lost");
        }, false);
        
        canvas.addEventListener("webglcontextrestored", function() {
            console.log("WebGL context restored, reinitializing...");
            initGL(canvas);
            initShaders();
            loadTeapot();
            loadKangaroo();
        }, false);

        tick();
    }


    //*************************************************
    // Parsing parameters
    //*************************************************
    function update_ambient_light(){
        ka = document.getElementById("am_ka").value;
    }

    function update_light_location(){
        light_locations1[0] = document.getElementById("llocX1").value;
        light_locations1[1] = document.getElementById("llocY1").value;
        light_locations1[2] = document.getElementById("llocZ1").value;
        light_locations2[0] = document.getElementById("llocX2").value;
        light_locations2[1] = document.getElementById("llocY2").value;
        light_locations2[2] = document.getElementById("llocZ2").value;
    }
    
    function update_light_color(){
        light_colors1[0] = document.getElementById("lcolR1").value;
        light_colors1[1] = document.getElementById("lcolG1").value;
        light_colors1[2] = document.getElementById("lcolB1").value;
        light_colors2[0] = document.getElementById("lcolR2").value;
        light_colors2[1] = document.getElementById("lcolG2").value;
        light_colors2[2] = document.getElementById("lcolB2").value;
    }
    
    function update_trans(){
        var tx = document.getElementById("transX").value;
        var ty = document.getElementById("transY").value;
        var tz = document.getElementById("transZ").value;

        return vec3.create([tx, ty, tz]);
    }

    function update_rotate(){
        var rx = document.getElementById("rotateX").value;
        var ry = document.getElementById("rotateY").value;
        var rz = document.getElementById("rotateZ").value;

        return vec3.create([rx, ry, rz]);
    }
    
    // 添加缩放函数
    function update_scale(){
        var sx = document.getElementById("scaleX").value;
        var sy = document.getElementById("scaleY").value;
        var sz = document.getElementById("scaleZ").value;

        return vec3.create([sx, sy, sz]);
    }
    
    // 添加剪切函数
    function update_shear(){
        var xy = document.getElementById("shearXY").value;
        var xz = document.getElementById("shearXZ").value;
        var yz = document.getElementById("shearYZ").value;

        return vec3.create([xy, xz, yz]);
    }
    
    // 应用剪切变换到矩阵
    function applyShear(matrix, xy, xz, yz) {
        // 创建剪切矩阵
        var shearMatrix = mat4.create();
        mat4.identity(shearMatrix);
        
        // XY平面剪切
        shearMatrix[4] = parseFloat(xy); // x对y的剪切
        
        // XZ平面剪切
        shearMatrix[8] = parseFloat(xz); // x对z的剪切
        
        // YZ平面剪切
        shearMatrix[9] = parseFloat(yz); // y对z的剪切
        
        // 将剪切矩阵与当前模型视图矩阵相乘
        mat4.multiply(matrix, shearMatrix);
    }
    
    // Function to update clipping planes
    function update_clip_planes(){
        clipPlaneX = document.getElementById("clipPlaneX").value;
        clipPlaneZ = document.getElementById("clipPlaneZ").value;
    }

    // Debug mode toggle function
    function toggleDebug() {
        debugMode = !debugMode;
        document.getElementById("debugStatus").innerHTML = debugMode ? "ON" : "OFF";
        document.getElementById("debugStatus").style.color = debugMode ? "green" : "gray";
        document.getElementById("debugButton").innerHTML = debugMode ? "Disable Debug Mode" : "Enable Debug Mode";
        console.log("Debug mode " + (debugMode ? "enabled" : "disabled"));
        
        if (debugMode) {
            // Output current status immediately
            console.log("===== WebGL Status Check =====");
            console.log("Canvas size:", gl.viewportWidth, "x", gl.viewportHeight);
            console.log("Teapot model load status:", teapotVertexPositionBuffer ? "Loaded" : "Not loaded");
            console.log("Kangaroo model load status:", kangarooVertexPositionBuffer ? "Loaded" : "Not loaded");
            console.log("Shader program status:", shaderProgram ? "Initialized" : "Not initialized");
            
            // Check WebGL context errors
            var glError = gl.getError();
            if (glError !== gl.NO_ERROR) {
                console.error("WebGL error:", glError);
            } else {
                console.log("WebGL status: Normal");
            }
        }
    }

    // 新增著色器切換函數
    function updateShadingType() {
        shadingType = parseInt(document.getElementById("shadingType").value);
        gl.useProgram(shaderProgram);
        gl.uniform1i(gl.getUniformLocation(shaderProgram, "vsShadingType"), shadingType);
        gl.uniform1i(gl.getUniformLocation(shaderProgram, "fsShadingType"), shadingType);
        
        // 更新標籤顯示
        var shadingLabel = document.getElementById("shadingTypeLabel");
        if(shadingType === 0) {
            shadingLabel.textContent = "Flat shading";
        } else if(shadingType === 1) {
            shadingLabel.textContent = "Gouraud shading";
        } else {
            shadingLabel.textContent = "Phong shading";
        }
    }

</script>
</head>

<body onload="webGLStart();">
    <p style="position: absolute; right: 2%; top:6%; ">
        <canvas id="ICG-canvas" style="border: none;" width="800" height="600"></canvas>
    </p>

    <p style="position: absolute; left: 1%; top: 1%; max-width: 30%; min-width: 30%; ">

        <p>
            <label for="shading">Shading Type: <span id="shadingTypeLabel">Gouraud shading</span></label>
        </p>

        </br>
        <span>Ambient Light</span>
        <table>
            <tr>
                <td>Ka: <input style="max-width: 70%; vertical-align: middle;" id="am_ka" type="range" autocomplete="off" value="0.1" max="1." min="0." step="0.05" oninput="update_ambient_light()"></td>
            </tr>
        </table>
        </br>
        <span>Light 0</span>
        <table>
            <tr>
                <td>X: <input style="max-width: 70%; vertical-align: middle;" id="llocX1" type="range" autocomplete="off" value="30." max="40." min="-40." oninput="update_light_location()"></td>
                <td>Y: <input style="max-width: 70%; vertical-align: middle;" id="llocY1" type="range" autocomplete="off" value="20." max="40." min="-40." oninput="update_light_location()"></td>
                <td>Z: <input style="max-width: 70%; vertical-align: middle;" id="llocZ1" type="range" autocomplete="off" value="-25." max="0." min="-75." oninput="update_light_location()"></td>
            </tr>
        </table>
        <table>
            <tr>
                <td>R: <input style="max-width: 70%; vertical-align: middle;" id="lcolR1" type="range" autocomplete="off" value="1.0" max="1.0" min="0.0" step="0.05" oninput="update_light_color()"></td>
                <td>G: <input style="max-width: 70%; vertical-align: middle;" id="lcolG1" type="range" autocomplete="off" value="0.8" max="1.0" min="0.0" step="0.05" oninput="update_light_color()"></td>
                <td>B: <input style="max-width: 70%; vertical-align: middle;" id="lcolB1" type="range" autocomplete="off" value="0.8" max="1.0" min="0.0" step="0.05" oninput="update_light_color()"></td>
            </tr>
        </table>
        </br>
        <span>Light 1</span>
        <table>
            <tr>
                <td>X: <input style="max-width: 70%; vertical-align: middle;" id="llocX2" type="range" autocomplete="off" value="-20." max="0." min="-40." oninput="update_light_location()"></td>
                <td>Y: <input style="max-width: 70%; vertical-align: middle;" id="llocY2" type="range" autocomplete="off" value="15." max="20." min="-5." oninput="update_light_location()"></td>
                <td>Z: <input style="max-width: 70%; vertical-align: middle;" id="llocZ2" type="range" autocomplete="off" value="-40." max="0." min="-80." oninput="update_light_location()"></td>
            </tr>
        </table>
        <table>
            <tr>
                <td>R: <input style="max-width: 70%; vertical-align: middle;" id="lcolR2" type="range" autocomplete="off" value="0.8" max="1.0" min="0.0" step="0.05" oninput="update_light_color()"></td>
                <td>G: <input style="max-width: 70%; vertical-align: middle;" id="lcolG2" type="range" autocomplete="off" value="0.8" max="1.0" min="0.0" step="0.05" oninput="update_light_color()"></td>
                <td>B: <input style="max-width: 70%; vertical-align: middle;" id="lcolB2" type="range" autocomplete="off" value="1.0" max="1.0" min="0.0" step="0.05" oninput="update_light_color()"></td>
            </tr>
        </table>
        </br>
        <span>Clipping</span>
        <table>
            <tr>
                <td>Teapot (X Plane): <input style="max-width: 70%; vertical-align: middle;" id="clipPlaneX" type="range" autocomplete="off" value="0." max="20." min="-20." step="0.5" oninput="update_clip_planes()"></td>
            </tr>
            <tr>
                <td>Kangaroo (Z Plane): <input style="max-width: 70%; vertical-align: middle;" id="clipPlaneZ" type="range" autocomplete="off" value="0." max="20." min="-40." step="0.5" oninput="update_clip_planes()"></td>
            </tr>
        </table>
        </br>
        </br>

        <span>Object</span>
        <table>
            <tr>
            <th></th>
            <th>X axis</th>
            <th>Y axis</th>
            <th>Z axis</th>
            </tr>
            <tr>
                <td>Trans.</td>
                <td><input id="transX" type="range" autocomplete="off" value="0." max="50." min="-50." oninput="update_trans()"></td>
                <td><input id="transY" type="range" autocomplete="off" value="0." max="50." min="-50." oninput="update_trans()"></td>
                <td><input id="transZ" type="range" autocomplete="off" value="-50." max="0." min="-120." oninput="update_trans()"></td>
            </tr>
            <tr>
                <td>Rotate</td>
                <td><input id="rotateX" type="range" autocomplete="off" value="0." max="180." min="-180." oninput="update_rotate()"></td>
                <td><input id="rotateY" type="range" autocomplete="off" value="0." max="180." min="-180." oninput="update_rotate()"></td>
                <td><input id="rotateZ" type="range" autocomplete="off" value="0." max="180." min="-180." oninput="update_rotate()"></td>
            </tr>
            <tr>
                <td>Scale</td>
                <td><input id="scaleX" type="range" autocomplete="off" value="1." max="2.5" min="0.1" step="0.1" oninput="update_scale()"></td>
                <td><input id="scaleY" type="range" autocomplete="off" value="1." max="2.5" min="0.1" step="0.1" oninput="update_scale()"></td>
                <td><input id="scaleZ" type="range" autocomplete="off" value="1." max="2.5" min="0.1" step="0.1" oninput="update_scale()"></td>
            </tr>
            <tr>
                <td>Shear</td>
                <td><input id="shearXY" type="range" autocomplete="off" value="0." max="1.0" min="-1.0" step="0.1" oninput="update_shear()"></td>
                <td><input id="shearXZ" type="range" autocomplete="off" value="0." max="1.0" min="-1.0" step="0.1" oninput="update_shear()"></td>
                <td><input id="shearYZ" type="range" autocomplete="off" value="0." max="1.0" min="-1.0" step="0.1" oninput="update_shear()"></td>
            </tr>
        </table>

        <table style="border: 0; padding: 10px;">
        <tr>
            <td colspan="3">
                <b>Shading Type:</b>
                <select id="shadingType" onchange="updateShadingType()">
                    <option value="0">Flat Shading</option>
                    <option value="1" selected>Gouraud Shading</option>
                    <option value="2">Phong Shading</option>
                </select>
            </td>
        </tr>
        <tr>
            <td colspan="3">
                <button onclick="toggleDebug()" id="debugButton">Enable Debug Mode</button>
                <span id="debugStatus" style="margin-left: 10px; color: gray;">OFF</span>
            </td>
        </tr>
        </table>
    </p>

</body>

</html>
